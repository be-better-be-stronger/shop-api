spring.application.name=shop

spring.devtools.restart.enabled=false

server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/shop_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:}

# ===============================
# JPA / Hibernate
# ===============================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Ho_Chi_Minh

# ===============================
# Flyway
# ===============================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
#spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=baseline

# ===============================
# Message source
# ===============================
spring.messages.basename=messages
spring.messages.encoding=UTF-8



#logging
logging.level.root=INFO
logging.level.com.shop=DEBUG
server.error.include-message=always

logging.level.org.springframework.cache=TRACE
logging.level.org.springframework.cache.interceptor=TRACE

logging.level.org.springframework.data.redis.cache=TRACE
logging.level.org.springframework.data.redis.core=DEBUG
logging.level.org.springframework.data.redis.serializer=TRACE

logging.level.io.lettuce.core=INFO

# ===============================
# App config
# ===============================
app.jwt.secret=CHANGE_THIS_TO_A_LONG_RANDOM_SECRET_32+_CHARS_MIN
app.jwt.ttlSeconds=3600  
#time To Live (s)


# Upload root
app.upload.root=uploads

# Cleanup staging
app.upload.cleanup.staging.enabled=true
app.upload.cleanup.staging.cron=0 */30 * * * *
app.upload.cleanup.staging.ttl=PT6H
app.upload.cleanup.staging.maxDeletePerRun=500

# Redis connection
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Use Redis as Spring Cache
spring.cache.type=redis

# Cache config
spring.cache.type=redis

# TTL (10 phút)
spring.cache.redis.time-to-live=600000

# Không cache null
spring.cache.redis.cache-null-values=false


